<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · Eof-bot</title>
  <!-- Inline CSS: theme.css sits behind sign-in so this page cannot load it. Only /fonts is public -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.55 'Be Vietnam Pro', system-ui, sans-serif; color: #22201C; background: #F7F5EF;
    }
    main {
      width: min(400px, calc(100% - 32px)); padding: 40px 36px 32px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: #fff; border: 1px solid rgba(34, 32, 28, .10); border-radius: 20px;
      box-shadow: 0 1px 2px rgba(34, 32, 28, .04), 0 8px 24px rgba(34, 32, 28, .05);
    }
    .mark {
      width: 48px; height: 48px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
      border-radius: 13px; background: #B5532F; color: #fff; font: italic 30px/1 'Literata', Georgia, serif;
    }
    h1 { margin: 0; font: 500 28px/1.2 'Literata', Georgia, serif; }
    p { margin: 0 0 20px; color: #6E6A61; }
    a {
      width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 10px 16px; border: 1px solid rgba(34, 32, 28, .20); border-radius: 12px;
      color: #22201C; background: #fff; font-weight: 500; text-decoration: none;
    }
    a:hover { background: #FAF8F3; border-color: rgba(34, 32, 28, .32); }
    small { margin-top: 12px; font-size: 12px; color: #6E6A61; }
  </style>
</head>
<body>
  <main>
    <span class="mark">e</span>
    <h1>Eof-bot</h1>
    <p>Hỏi đáp theo tài liệu nội bộ</p>
    <a href="/auth/login">
      <svg width="20" height="20" viewBox="0 0 21 21" aria-hidden="true">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Đăng nhập bằng Microsoft
    </a>
    <small>Dùng tài khoản công ty</small>
  </main>
</body>
</html>
